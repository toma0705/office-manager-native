# PR と main への push で、コードの検査とテストを行う
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint・整形・型チェック・テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier（整形されているか）
        run: npm run format:check
      - name: TypeScript の型チェック
        run: npm run typecheck
      - name: テスト（Jest）
        run: npm test -- --ci
